<div class="list-group-item text-body px-2 py-2 border-bottom border-secondary-subtle list-group-item-action plato-row js-plato-carousel-index {% if user.id == plato.propietario.id and not plato.proviene_de %}plato-row-procedencia-propia{% elif user.id == plato.propietario.id and plato.proviene_de %}plato-row-procedencia-importada{% else %}plato-row-procedencia-ajena{% endif %}"
     data-row
     data-plato-id="{{ plato.id }}"
     data-plato-nombre="{{ plato.nombre_plato|escape }}"
     role="button"
     tabindex="0">

  <div class="d-flex align-items-center gap-2">

    <div class="form-check m-0 flex-shrink-0">
      <input class="form-check-input js-plato-select"
             type="checkbox"
             name="platos_selected"
             value="{{ plato.id }}"
             aria-label="Seleccionar plato">
    </div>

    <div class="flex-grow-1 min-w-0 fw-semibold text-truncate">
      <span class="plato-row-nombre">
        {{ plato.nombre_plato }}
      </span>
    </div>

    <div class="plato-gmail-actions flex-shrink-0" aria-label="Acciones del plato">
      {% if plato.enlace %}
        <a href="{{ plato.enlace }}"
           class="btn plato-gmail-action-btn plato-gmail-action-enlace"
           target="_blank"
           rel="noopener noreferrer"
           onclick="event.stopPropagation();"
           title="Abrir enlace"
           aria-label="Abrir enlace relacionado de {{ plato.nombre_plato|escape }}">
          <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </a>
      {% endif %}

      <a href="#"
         class="btn plato-gmail-action-btn plato-gmail-action-programar btn-programar"
         data-bs-toggle="modal"
         data-bs-target="#asignarPlatoModal"
         onclick="event.preventDefault(); event.stopPropagation(); setPlatoInfo('{{ plato.id }}', 'plato', '{{ plato.nombre_plato|escapejs }}')"
         title="Programar"
         aria-label="Programar">
        <i class="fa-regular fa-calendar-plus" aria-hidden="true"></i>
      </a>

      <a href="#"
         class="btn plato-gmail-action-btn plato-gmail-action-ingredientes js-plato-ingredientes"
         data-url="{% url 'plato_ingredientes' plato.id %}"
         onclick="event.preventDefault(); event.stopPropagation(); window.openPlatoIngredientesModal(this.dataset.url);"
         title="Ingredientes"
         aria-label="Ver ingredientes de {{ plato.nombre_plato|escape }}">
        <i class="fa-solid fa-list-check" aria-hidden="true"></i>
      </a>

      {% if amigues %}
        <a href="#"
           class="btn plato-gmail-action-btn plato-gmail-action-compartir"
           data-bs-toggle="modal"
           data-bs-target="#compartirModal"
           onclick="event.preventDefault(); event.stopPropagation(); setPlatoInfo('{{ plato.id }}', 'plato', '{{ plato.nombre_plato|escapejs }}')"
           title="Compartir"
           aria-label="Compartir {{ plato.nombre_plato|escape }}">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
        </a>
      {% endif %}

      {% if plato.propietario == request.user %}
        <a data-plato-sheet-open href="{% url 'videos-update' plato.id %}?return_to={{ return_to_url|urlencode }}{% if tipopag %}&tipopag={{ tipopag|urlencode }}{% endif %}"
           class="btn plato-gmail-action-btn plato-gmail-action-editar"
           onclick="event.stopPropagation();"
           title="Editar"
           aria-label="Editar {{ plato.nombre_plato|escape }}">
          <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
        </a>

        <a href="{% url 'agregar-a-mi-lista' plato.id %}?duplicar=true"
           class="btn plato-gmail-action-btn plato-gmail-action-duplicar"
           onclick="event.stopPropagation();"
           title="Duplicar plato"
           aria-label="Duplicar {{ plato.nombre_plato|escape }}">
          <i class="fa-regular fa-clone" aria-hidden="true"></i>
        </a>

        <a href="#"
           class="btn plato-gmail-action-btn plato-gmail-action-eliminar"
           data-bs-toggle="modal"
           data-bs-target="#confirmActionModal"
           data-confirm-title="Eliminar plato"
           data-confirm-body="¿Seguro que querés borrar {{ plato.nombre_plato|escape }}?"
           data-confirm-hint="También se borrarán las programaciones de este plato. Esta acción no se puede deshacer."
           data-confirm-action="{% url 'eliminar-plato' plato.id %}?return_to={{ return_to_url|urlencode }}"
           data-confirm-btn="Sí, borrar"
           onclick="event.stopPropagation();"
           title="Eliminar"
           aria-label="Eliminar {{ plato.nombre_plato|escape }}">
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
        </a>
      {% endif %}
    </div>

  </div>
</div>
