{# Toast por querystring: ?msg=...&level=success|danger|warning|info #}
{# Delega al helper global qcToast (definido en _toast_global.html). #}
{% with msg=request.GET.msg level=request.GET.level|default:"success" %}
  {% if msg %}
    <script>
      (function () {
        var message = "{{ msg|escapejs }}";
        var level = "{{ level|escapejs }}";

        function tryShow() {
          if (window.qcToast) {
            window.qcToast(message, level);
            return true;
          }
          return false;
        }

        if (!tryShow()) {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", tryShow);
          } else {
            setTimeout(tryShow, 50);
          }
        }

        try {
          var url = new URL(window.location.href);
          url.searchParams.delete("msg");
          url.searchParams.delete("level");
          window.history.replaceState({}, "", url.toString());
        } catch (e) {}
      })();
    </script>
  {% endif %}
{% endwith %}
