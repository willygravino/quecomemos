{# §31-reformulado: modal para crear slot semanal (filtro permanente por dia/momento) #}
<div class="modal fade" id="crearSlotModal" tabindex="-1"
     aria-labelledby="crearSlotLabel" aria-hidden="true"
     data-crear-slot-url="{% url 'ajax_crear_slot' %}">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="crearSlotLabel">
          Agregar slot
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="slotDiaInput" value="">
        <input type="hidden" id="slotMomentoInput" value="">
        <p class="text-muted small mb-2">
          Elegí qué tipo de plato querés para esta comida. El slot queda como recordatorio permanente
          hasta que lo borres.
        </p>
        <div class="list-group">
          {% for key, info in presets.items %}
            <button type="button"
                    class="list-group-item list-group-item-action js-elegir-preset d-flex justify-content-between align-items-center"
                    data-preset="{{ key }}">
              <span>{{ info.label }}</span>
              <i class="fa-solid fa-chevron-right text-muted" aria-hidden="true"></i>
            </button>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
